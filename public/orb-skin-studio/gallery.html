<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orb Skin Studio - Gallery</title>
    <style>
        :root {
            --primary-bg: #0a0a0a;
            --panel-bg: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: #333333;
            --accent-cyan: #00f0ff;
            --accent-purple: #8a2be2;
            --accent-gold: #ffd700;
            --success-color: #00ff88;
            --error-color: #ff4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .nav {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--accent-cyan);
            background: rgba(0,240,255,0.1);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .gallery-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .gallery-title {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .gallery-subtitle {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .gallery-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 40px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 36px;
            font-weight: 700;
            color: var(--accent-cyan);
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .gallery-filters {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            background: var(--primary-bg);
            color: var(--text-primary);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .gallery-item {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
        }

        .gallery-item:hover {
            border-color: var(--accent-cyan);
            transform: translateY(-5px);
        }

        .gallery-preview {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .orb-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            transition: all 0.3s;
        }

        .gallery-item:hover .orb-preview {
            transform: scale(1.1);
        }

        .gallery-info {
            padding: 20px;
        }

        .gallery-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--accent-cyan);
        }

        .gallery-details {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .gallery-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .gallery-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .gallery-btn {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background: var(--primary-bg);
            color: var(--text-primary);
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .gallery-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .gallery-btn.primary {
            background: var(--accent-cyan);
            color: var(--primary-bg);
            border-color: var(--accent-cyan);
        }

        .gallery-btn.primary:hover {
            background: #00d4ff;
        }

        .gallery-empty {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }

        .gallery-empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .gallery-empty h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .gallery-empty p {
            margin-bottom: 30px;
        }

        .gallery-cta {
            display: inline-block;
            padding: 12px 24px;
            background: var(--accent-cyan);
            color: var(--primary-bg);
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .gallery-cta:hover {
            background: #00d4ff;
            transform: translateY(-2px);
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            z-index: 1001;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            max-width: 300px;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification-success {
            background: var(--success-color);
            color: #000;
        }

        .notification-error {
            background: var(--error-color);
        }

        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 20px;
            }

            .gallery-stats {
                gap: 20px;
            }

            .gallery-filters {
                gap: 10px;
            }

            .filter-btn {
                padding: 8px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-title">Orb Skin Studio</div>
        <div class="nav-links">
            <a href="orb_skin_gen.html" class="nav-link">Studio</a>
            <a href="pricing.html" class="nav-link">Pricing</a>
            <a href="upload.html" class="nav-link">Assets</a>
            <a href="cart.html" class="nav-link">Cart</a>
            <a href="account.html" class="nav-link">Account</a>
            <a href="gallery.html" class="nav-link active">Gallery</a>
            <a href="contact.html" class="nav-link">Contact</a>
            <a href="#" class="nav-link">Support</a>
        </div>
    </nav>

    <div class="container">
        <div class="gallery-header">
            <h1 class="gallery-title">Orb Skin Gallery</h1>
            <p class="gallery-subtitle">Explore amazing orb skin creations from our community</p>

            <div class="gallery-stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalSkins">0</div>
                    <div class="stat-label">Total Skins</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="uniqueCreators">0</div>
                    <div class="stat-label">Creators</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="featuredSkins">0</div>
                    <div class="stat-label">Featured</div>
                </div>
            </div>
        </div>

        <div class="gallery-filters">
            <button class="filter-btn active" data-filter="all">All Skins</button>
            <button class="filter-btn" data-filter="saved">Saved</button>
            <button class="filter-btn" data-filter="featured">Featured</button>
            <button class="filter-btn" data-filter="recent">Recent</button>
        </div>

        <div class="gallery-grid" id="galleryGrid">
            <!-- Gallery items will be populated by JavaScript -->
        </div>
    </div>

    <script>
        class Gallery {
            constructor() {
                this.skins = [];
                this.filteredSkins = [];
                this.currentFilter = 'all';
                this.init();
            }

            init() {
                this.loadSkins();
                this.bindEvents();
                this.renderGallery();
                this.updateStats();
            }

            loadSkins() {
                try {
                    // Load saved skins
                    const savedSkinsData = localStorage.getItem('orbSkinStudio_savedSkins');
                    if (savedSkinsData) {
                        const savedSkins = JSON.parse(savedSkinsData);
                        this.skins = savedSkins.map(skin => ({
                            ...skin,
                            type: 'saved',
                            featured: Math.random() > 0.8 // Randomly mark some as featured
                        }));
                    }

                    // Load drafts (public ones)
                    const draftsData = localStorage.getItem('orbSkinStudio_drafts');
                    if (draftsData) {
                        const drafts = JSON.parse(draftsData);
                        const publicDrafts = drafts.filter(draft => draft.public !== false).map(draft => ({
                            ...draft,
                            type: 'draft',
                            featured: Math.random() > 0.9
                        }));
                        this.skins = [...this.skins, ...publicDrafts];
                    }

                    // Sort by creation date (newest first)
                    this.skins.sort((a, b) => new Date(b.created || b.savedAt) - new Date(a.created || a.savedAt));

                } catch (e) {
                    console.error('Failed to load skins:', e);
                }
            }

            bindEvents() {
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.currentFilter = btn.dataset.filter;
                        this.filterSkins();
                        this.renderGallery();
                    });
                });
            }

            filterSkins() {
                switch (this.currentFilter) {
                    case 'saved':
                        this.filteredSkins = this.skins.filter(skin => skin.type === 'saved');
                        break;
                    case 'featured':
                        this.filteredSkins = this.skins.filter(skin => skin.featured);
                        break;
                    case 'recent':
                        this.filteredSkins = this.skins.slice(0, 12); // Show 12 most recent
                        break;
                    default:
                        this.filteredSkins = this.skins;
                }
            }

            renderGallery() {
                this.filterSkins();
                const container = document.getElementById('galleryGrid');

                if (this.filteredSkins.length === 0) {
                    container.innerHTML = `
                        <div class="gallery-empty">
                            <div class="gallery-empty-icon">🎨</div>
                            <h3>No skins found</h3>
                            <p>Be the first to create and share amazing orb skins!</p>
                            <a href="orb_skin_gen.html" class="gallery-cta">Create Your First Orb</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = this.filteredSkins.map(skin => `
                    <div class="gallery-item" onclick="gallery.loadSkin('${skin.id}')">
                        <div class="gallery-preview">
                            <div class="orb-preview" style="
                                background: ${this.getSkinGradient(skin)};
                                animation: ${skin.animation} ${skin.animation === 'none' ? '0' : '2s'} infinite;
                                border-radius: ${skin.shape === 'crystal' ? '0' : '50%'};
                                clip-path: ${skin.shape === 'crystal' ? 'polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%)' : 'none'};
                            ">
                                ${skin.avatar?.enabled ? '👤' : '✨'}
                            </div>
                        </div>
                        <div class="gallery-info">
                            <div class="gallery-name">${skin.name}</div>
                            <div class="gallery-details">
                                Shape: ${skin.shape} | Color: ${skin.colorScheme} | Animation: ${skin.animation}
                            </div>
                            <div class="gallery-meta">
                                <span>${this.formatDate(skin.created || skin.savedAt)}</span>
                                <span>${skin.type === 'saved' ? 'Saved' : 'Draft'}</span>
                            </div>
                            <div class="gallery-actions">
                                <button class="gallery-btn" onclick="event.stopPropagation(); gallery.loadSkin('${skin.id}')">View</button>
                                <button class="gallery-btn primary" onclick="event.stopPropagation(); gallery.addToCart('${skin.id}')">Add to Cart</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            getSkinGradient(skin) {
                const gradients = {
                    cyber: 'linear-gradient(135deg, #00f0ff, #b829dd)',
                    sunset: 'linear-gradient(135deg, #ff6b6b, #ffd93d)',
                    forest: 'linear-gradient(135deg, #00b894, #00cec9)',
                    neon: 'linear-gradient(135deg, #ff0080, #00ff80)',
                    cosmic: 'linear-gradient(135deg, #8a2be2, #4169e1)',
                    fire: 'linear-gradient(135deg, #ff4500, #ffd700)',
                    ice: 'linear-gradient(135deg, #87ceeb, #ffffff)',
                    plasma: 'linear-gradient(135deg, #ff1493, #00bfff)'
                };
                return gradients[skin.colorScheme] || 'linear-gradient(135deg, #666, #999)';
            }

            formatDate(dateString) {
                if (!dateString) return 'Unknown';
                const date = new Date(dateString);
                const now = new Date();
                const diff = now - date;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));

                if (days === 0) return 'Today';
                if (days === 1) return 'Yesterday';
                if (days < 7) return `${days} days ago`;
                return date.toLocaleDateString();
            }

            loadSkin(skinId) {
                // Find the skin
                const skin = this.skins.find(s => s.id === skinId);
                if (!skin) return;

                // Store for studio to load
                localStorage.setItem('orbSkinStudio_galleryLoad', JSON.stringify(skin));

                // Redirect to studio
                window.location.href = 'orb_skin_gen.html?load=gallery';
            }

            addToCart(skinId) {
                const skin = this.skins.find(s => s.id === skinId);
                if (!skin) return;

                // Add to cart (similar to studio addToCart)
                const cartItem = {
                    id: 'gallery-' + skinId + '-' + Date.now(),
                    name: skin.name,
                    config: skin,
                    price: 2.99,
                    quantity: 1,
                    addedAt: new Date().toISOString(),
                    preview: this.getSkinGradient(skin)
                };

                // Load existing cart
                let cart = [];
                try {
                    const cartData = localStorage.getItem('orbSkinStudio_cart');
                    if (cartData) {
                        cart = JSON.parse(cartData);
                    }
                } catch (e) {
                    console.error('Failed to load cart:', e);
                }

                // Add item
                cart.push(cartItem);

                // Save cart
                try {
                    localStorage.setItem('orbSkinStudio_cart', JSON.stringify(cart));
                } catch (e) {
                    console.error('Failed to save cart:', e);
                }

                this.showNotification('Skin added to cart!', 'success');
            }

            updateStats() {
                const totalSkins = this.skins.length;
                const uniqueCreators = new Set(this.skins.map(skin => skin.creator || 'anonymous')).size;
                const featuredSkins = this.skins.filter(skin => skin.featured).length;

                document.getElementById('totalSkins').textContent = totalSkins;
                document.getElementById('uniqueCreators').textContent = uniqueCreators;
                document.getElementById('featuredSkins').textContent = featuredSkins;
            }

            showNotification(message, type = 'info') {
                const notification = document.createElement('div');
                notification.className = `notification notification-${type}`;
                notification.textContent = message;

                document.body.appendChild(notification);

                setTimeout(() => notification.classList.add('show'), 100);

                setTimeout(() => {
                    notification.classList.remove('show');
                    setTimeout(() => document.body.removeChild(notification), 300);
                }, 3000);
            }
        }

        // Initialize gallery
        const gallery = new Gallery();
    </script>
</body>
</html>
