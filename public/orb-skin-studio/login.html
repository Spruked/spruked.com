<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orb Skin Studio - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-bg: #0a0a0f;
            --panel-bg: #151520;
            --accent-cyan: #00f0ff;
            --accent-purple: #b829dd;
            --accent-gold: #ffd700;
            --text-primary: #ffffff;
            --text-secondary: #8b8b9e;
            --border-color: #2a2a3e;
            --success-color: #00ff88;
            --error-color: #ff4757;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-bg), #1a1a2e);
        }

        .login-container {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-title {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            background: var(--primary-bg);
            color: var(--text-primary);
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 2px rgba(0,240,255,0.2);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-cyan);
            color: var(--primary-bg);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }

        .login-btn:hover {
            background: #00d4ff;
            transform: translateY(-2px);
        }

        .login-btn:disabled {
            background: var(--border-color);
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
            color: var(--text-secondary);
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--border-color);
        }

        .divider span {
            background: var(--panel-bg);
            padding: 0 15px;
            position: relative;
            z-index: 1;
        }

        .guest-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: var(--accent-purple);
            border: 1px solid var(--accent-purple);
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .guest-btn:hover {
            background: rgba(184,41,221,0.1);
        }

        .error-message {
            background: var(--error-color);
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }

        .success-message {
            background: var(--success-color);
            color: #000;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
        }

        .register-link a {
            color: var(--accent-cyan);
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .user-type-selector {
            display: flex;
            margin-bottom: 20px;
            background: var(--primary-bg);
            border-radius: 8px;
            padding: 4px;
        }

        .user-type-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .user-type-btn.active {
            background: var(--accent-cyan);
            color: var(--primary-bg);
        }

        .admin-notice {
            background: rgba(255,215,0,0.1);
            border: 1px solid var(--accent-gold);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }

        .admin-notice h4 {
            color: var(--accent-gold);
            margin-bottom: 5px;
        }

        .admin-notice p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 20px;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1 class="login-title">Orb Skin Studio</h1>
            <p class="login-subtitle">Sign in to access your account</p>
        </div>

        <div class="user-type-selector">
            <button class="user-type-btn active" data-type="guest">Guest</button>
            <button class="user-type-btn" data-type="admin">Admin</button>
        </div>

        <div class="admin-notice" id="adminNotice">
            <h4>🔐 Admin Access</h4>
            <p>Administrative credentials required for dashboard access.</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" class="form-input" id="username" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
        </form>

        <div class="divider">
            <span>or</span>
        </div>

        <button class="guest-btn" id="guestBtn">Continue as Guest</button>

        <div class="register-link">
            <p>Don't have an account? <a href="#" id="registerLink">Create one</a></p>
        </div>
    </div>

    <script>
        class AuthManager {
            constructor() {
                this.currentUser = null;
                this.userType = 'guest';
                this.init();
            }

            init() {
                this.checkExistingSession();
                this.bindEvents();
                this.initializeDefaultUsers();
            }

            bindEvents() {
                // User type selector
                document.querySelectorAll('.user-type-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.user-type-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.userType = btn.dataset.type;
                        this.toggleAdminNotice();
                        this.clearMessages();
                    });
                });

                // Login form
                document.getElementById('loginForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleLogin();
                });

                // Guest button
                document.getElementById('guestBtn').addEventListener('click', () => {
                    this.loginAsGuest();
                });

                // Register link
                document.getElementById('registerLink').addEventListener('click', () => {
                    this.showRegistration();
                });
            }

            toggleAdminNotice() {
                const notice = document.getElementById('adminNotice');
                notice.style.display = this.userType === 'admin' ? 'block' : 'none';
            }

            initializeDefaultUsers() {
                // Initialize default users if not exists
                const users = JSON.parse(localStorage.getItem('orbStudio_users') || '[]');

                if (users.length === 0) {
                    const defaultUsers = [
                        {
                            id: 'admin-001',
                            username: 'admin',
                            password: 'admin123',
                            role: 'admin',
                            name: 'System Administrator',
                            email: 'admin@orbskinstudio.com',
                            created: new Date().toISOString()
                        },
                        {
                            id: 'guest-001',
                            username: 'guest',
                            password: 'guest123',
                            role: 'guest',
                            name: 'Guest User',
                            email: 'guest@example.com',
                            created: new Date().toISOString()
                        }
                    ];

                    localStorage.setItem('orbStudio_users', JSON.stringify(defaultUsers));
                }
            }

            handleLogin() {
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                if (!username || !password) {
                    this.showError('Please enter both username and password');
                    return;
                }

                const users = JSON.parse(localStorage.getItem('orbStudio_users') || '[]');
                const user = users.find(u => u.username === username && u.password === password && u.role === this.userType);

                if (user) {
                    this.loginUser(user);
                } else {
                    this.showError(`Invalid ${this.userType} credentials`);
                }
            }

            loginAsGuest() {
                const guestUser = {
                    id: 'guest-' + Date.now(),
                    username: 'guest',
                    role: 'guest',
                    name: 'Guest User',
                    isGuest: true,
                    sessionId: 'session-' + Date.now()
                };

                this.loginUser(guestUser);
            }

            loginUser(user) {
                // Create session
                const session = {
                    userId: user.id,
                    username: user.username,
                    role: user.role,
                    name: user.name,
                    loginTime: new Date().toISOString(),
                    sessionId: user.sessionId || ('session-' + Date.now())
                };

                // Store session
                localStorage.setItem('orbStudio_session', JSON.stringify(session));
                this.currentUser = session;

                this.showSuccess(`Welcome back, ${user.name}!`);

                // Redirect based on role
                setTimeout(() => {
                    if (user.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'orb_skin_gen.html';
                    }
                }, 1500);
            }

            checkExistingSession() {
                const session = JSON.parse(localStorage.getItem('orbStudio_session') || 'null');
                if (session) {
                    // Check if session is still valid (24 hours)
                    const loginTime = new Date(session.loginTime);
                    const now = new Date();
                    const hoursDiff = (now - loginTime) / (1000 * 60 * 60);

                    if (hoursDiff < 24) {
                        this.currentUser = session;
                        // Auto-redirect
                        if (session.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'orb_skin_gen.html';
                        }
                        return;
                    } else {
                        // Session expired
                        localStorage.removeItem('orbStudio_session');
                    }
                }
            }

            showRegistration() {
                // For now, just show a message
                this.showError('Registration feature coming soon. Use guest access or contact admin.');
            }

            showError(message) {
                const errorDiv = document.getElementById('errorMessage');
                const successDiv = document.getElementById('successMessage');

                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
                successDiv.style.display = 'none';
            }

            showSuccess(message) {
                const errorDiv = document.getElementById('errorMessage');
                const successDiv = document.getElementById('successMessage');

                successDiv.textContent = message;
                successDiv.style.display = 'block';
                errorDiv.style.display = 'none';
            }

            clearMessages() {
                document.getElementById('errorMessage').style.display = 'none';
                document.getElementById('successMessage').style.display = 'none';
            }
        }

        // Initialize
        const authManager = new AuthManager();
    </script>
</body>
</html>
